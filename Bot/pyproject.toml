[project]
name = "wathematica-advent-bot"
version = "0.1.0"
description = "Discord bot for submitting Wathematica Advent Calendar articles"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.5,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.10.1",
]
